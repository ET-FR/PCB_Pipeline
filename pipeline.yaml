# PCB_Pipeline definition.
# The orchestrator reads this file to decide which phases and stages run, when, and how.
# See docs/architecture.md for the reasoning behind each phase.

version: 2

inputs:
  kicad_cli: kicad-cli            # path to kicad-cli
  required_symbol_fields: [MPN]   # missing fields are reported as findings
  recommended_symbol_fields: [Voltage, Tolerance]

# Files expected in the hardware project repo (not in this repo).
project_layout:
  inputs_dir: inputs/             # documents given by the user for phase 0
  prd: design/prd.md
  spec: design/spec.yaml          # single source of truth for design intent
  spec_pdf: design/spec.pdf       # generated from spec.yaml, never edited by hand
  datasheets_dir: datasheets/     # local PDFs, named {mpn}@{revision}.pdf, not committed
  datasheets_index: datasheets/index.yaml   # committed: mpn, url, revision, sha256
  kicad_dir: kicad/
  review_dir: review/             # findings and decisions, one folder per run

library:
  component_sheets: library/component_sheets
  cache_key: "{mpn}@{datasheet_revision}"

# Working loop: the user stops, saves, runs the pipeline. Nothing runs while KiCad edits.
loop:
  steps: [run, findings, proposals, user_decision, apply_accepted, commit]
  apply_requires:
    - git_clean_tree              # every change is a separate, revertable commit
    - kicad_file_saved            # warn if a KiCad lock file is present
  decisions_file: review/decisions.yaml

phases:
  - id: definition
    title: "Phase 0: product definition"
    kind: agent
    command: /define
    agents: [interviewer]
    knowledge: [knowledge/phase0_questions.md]
    description: >
      Read the documents in inputs/, answer the questions of phase0_questions.md from
      them, interview the user for the rest, write design/prd.md, then propose
      improvements to the question list.
    outputs: [design/prd.md]

  - id: architecture
    title: "Phase 1: architecture (paper design)"
    kind: agent
    command: /architecture
    agents: [architect]
    knowledge: [knowledge/architecture_checklist.md, knowledge/preferred_parts.yaml]
    rerun_on: [prd_changed]       # impact analysis: pcb-pipeline spec-diff
    stages:
      - id: block_diagram
        description: Functional blocks and interfaces between them.
      - id: component_selection
        agents: [component_selector]
        description: Propose candidates per block, the user chooses, record the reasons.
      - id: datasheet_fetch
        kind: deterministic
        command: pcb-pipeline fetch-datasheets design/spec.yaml
        description: Download every selected datasheet into datasheets/, update the index.
        params:
          fallback: ask_user        # list missing PDFs for manual download
      - id: datasheet
        agents: [datasheet_locator, datasheet_extractor, datasheet_critic]
        description: Build or refresh one component sheet per MPN.
        params:
          critic_min_score: 7
          max_attempts: 5
          human_validation_for: [power, mains]
      - id: power_tree
        description: Rails, currents, efficiency, dissipation, sequencing.
      - id: interfaces
        description: Connectors, harness pinout, I2C address map, MCU pin allocation.
      - id: mechanical
        description: Board size, mounting holes, keep-outs, stackup.
      - id: design_rules
        description: Electrical rules (derating, margins) and routing rules (width per current, impedance, clearances, diff pairs).
      - id: spec_checks
        kind: deterministic
        command: pcb-pipeline check-spec design/spec.yaml
        description: Schema, references, I2C conflicts, MCU pins, power budget, ratings versus sheets.
      - id: checklist
        kind: agent
        agents: [architect]
        description: Every item of knowledge/architecture_checklist.md answered, not applicable, or open.
      - id: spec_pdf
        kind: deterministic
        command: pcb-pipeline render-spec design/spec.yaml
        description: Render spec.yaml to design/spec.md and design/spec.pdf.
      - id: impact
        kind: deterministic
        command: pcb-pipeline spec-diff design/spec.yaml --against <last signed off revision>
        description: When the PRD changed, list what must be fetched, re-checked or changed.
    outputs: [design/spec.yaml, design/spec.md, design/spec.pdf, datasheets/index.yaml]
    gate: architecture_review     # the user signs off before schematic work starts

  - id: schematic
    title: "Phase 2: schematic"
    stages:
      - id: import
        kind: deterministic
        description: Export netlist and BOM with kicad-cli, parse symbol fields.
        outputs: [netlist.xml, bom.csv]
      - id: graph
        kind: deterministic
        description: Build the netlist graph and propose functional groups.
        params:
          neighborhood_depth: 2       # hops around an active part
          ignore_nets: [GND, "/GND"]  # nets too connected to be useful for grouping
      - id: spec_conformity
        kind: deterministic
        description: Schematic versus spec (BOM MPNs, rails, I2C addresses, connector pinouts).
      - id: rules
        kind: deterministic
        description: Run the rule engine (rules/checklist.yaml) against sheets and netlist.
      - id: conformity
        kind: agent
        agents: [conformity]
        description: Compare each functional group to its component sheets.
        params:
          consensus_runs: { default: 1, power: 3, mains: 3 }
          consensus_min_agreement: 2
      - id: merge
        kind: agent
        agents: [orchestrator]
        description: Deduplicate, group by root cause, rank by severity, attach a proposed fix.
        outputs: [findings.json]
      - id: report
        kind: deterministic
        outputs: [report.md]
    gate: schematic_review

  - id: layout
    title: "Phase 3: layout"
    stages:
      - id: rules_export
        kind: deterministic
        description: Generate KiCad net classes and a .kicad_dru file from spec.yaml design rules.
      - id: drc
        kind: deterministic
        description: kicad-cli pcb drc plus the pipeline's own layout rules.
      - id: layout_review
        kind: agent
        agents: [layout]
        description: Placement, return paths, decoupling, thermal, with pcbsight measurements.
    gate: pre_fabrication

  - id: simulation
    title: "Phase 4: simulation"
    enabled: false                # placeholder, not developed yet

# Agents write notes while they work so the next run skips work already done.
# Rules in agents/memory.md, format in schemas/notes.schema.json.
memory:
  project_notes: review/notes.yaml        # project scope, usable directly
  pipeline_notes: knowledge/notes.yaml    # pipeline scope, after the user accepts
  expire_on_change: [sheets, spec_revision, prd_revision, group_hash, files]
  never_skip_at_gates: [pre_fabrication]  # notes speed up iterations, not the final review

# Every run feeds the pipeline itself. See docs/architecture.md, "Learning loop".
learning:
  record_decisions: true          # accepted, rejected (false positive), deferred
  missed_issues: review/missed.yaml   # problems found later (bring-up, other review)
  promote:
    - missed_issue_to_rule        # a deterministic rule when the check is mechanical
    - missed_issue_to_trap        # always: a new trap in the trapped project tests
    - missed_issue_to_checklist   # an agent checklist item when it needs judgment
    - false_positive_to_rule_tuning
    - missed_issue_to_question    # when the issue came from a missing phase 0 answer
    - accepted_note_to_knowledge  # pipeline notes merged into knowledge/notes.yaml
    - validated_sheet_to_library  # component sheets are shared across projects
  changes_to_pipeline: pull_request   # proposed by the agent, accepted by the user

models:
  extraction: high_capability     # datasheet extraction, conformity, architecture
  triage: low_cost                # page location, deduplication
