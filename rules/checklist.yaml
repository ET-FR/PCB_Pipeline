# Deterministic rules. Each rule has an id used in findings evidence.
version: 1

rules:
  - id: SYM-001
    description: Every non-passive symbol has an MPN field (symbols excluded from the BOM are skipped).
    severity: major
    params:
      ignore_ref_prefixes: [LOGO, FID]   # board graphics and fiducials

  - id: PIN-001
    description: Pins marked no_float or must_connect are connected to a net with at least one other node.
    severity: critical

  - id: PIN-002
    description: Pins marked must_not_connect have no other node on their net.
    severity: major

  - id: CAP-001
    description: Ceramic capacitor voltage rating versus applied rail voltage.
    severity: major
    params:
      min_ratio: 1.5        # rated voltage >= 1.5 x applied voltage
      recommended_ratio: 2.0

  - id: ABS-001
    description: Rail voltage stays below the absolute maximum of every pin connected to it.
    severity: critical

  - id: EQ-001
    description: Datasheet equations (e.g. feedback divider) give the target value within tolerance.
    severity: major
    params:
      tolerance_percent: 2

  # Spec rules (phase 1), run by `pcb-pipeline check-spec` on design/spec.yaml.
  - id: SPEC-001
    description: Every id referenced in the spec (block, part, rail) exists, and ids are unique.
    severity: major

  - id: BUS-001
    description: No two devices share an I2C address on the same bus.
    severity: critical

  - id: BUS-002
    description: Every I2C device has a declared address.
    severity: minor

  - id: MCU-001
    description: Every MCU pin is assigned to one function only.
    severity: critical

  - id: PWR-001
    description: Worst case rail load (loads plus child rails) stays below the source capacity.
    severity: critical

  - id: PWR-002
    description: Worst case rail load stays below a margin of the source capacity.
    severity: major
    params:
      max_ratio: 0.8        # overridden by design_rules.electrical.rail_load_ratio in the spec

  - id: PWR-003
    description: Every regulated rail with loads declares its source capacity.
    severity: minor

  - id: PWR-004
    description: Rail voltages are consistent (min <= nominal <= max, buck and LDO below input, boost above).
    severity: major

  - id: PWR-005
    description: LDO dissipation at maximum input voltage and worst case load (information for thermal design).
    severity: info

  - id: RAT-001
    description: Converter input range and absolute maximum cover the parent rail (min, max, transient).
    severity: major       # absolute maximum exceeded is always critical

  - id: RAT-002
    description: Converter output current rating covers the worst case rail load.
    severity: critical

  - id: RAT-003
    description: Each load's supply range covers the rail it is powered from.
    severity: major       # absolute maximum exceeded is always critical

  - id: LAY-001
    description: Net class vias keep the manufacturer annular ring and drill limits (design_rules).
    severity: major

  - id: RAT-004
    description: Every selected part has a component sheet, otherwise its ratings are not checked.
    severity: minor

# Rail voltages are not in the netlist. Declare them here, with --rail, or with
# --spec design/spec.yaml (max_v of each rail, or nominal_v).
rails: {}
#  "/+5V": 5.0
#  "/VIN": 12.0
