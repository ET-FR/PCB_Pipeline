# Parts the user already trusts, reused first by the component selector.
# Entries are added by pull request when the user picks a part that could serve
# other projects. Remove or mark `avoid` when a part disappoints, with the reason.
#
# - mpn: TPS62133
#   manufacturer: Texas Instruments
#   role: buck 3 V to 17 V in, 3 A
#   why: "Used on 3 boards, easy layout, good light load efficiency"
#   status: preferred        # preferred | ok | avoid
#   projects: [board_a, board_b]
#   notes: ""
parts:
  - mpn: TPS54202DDCR
    manufacturer: Texas Instruments
    role: sync buck 4.5-28 V in, 2 A, SOT-23-6
    why: "Cheap and well stocked at LCSC (C191884), used on the V5 mainboard and FRONT_BOARD; Eco-mode pulse skipping cannot be disabled, filter analog branches"
    status: preferred
    projects: [FRONT_BOARD]
    notes: "Sheet SLVSD26C in library/component_sheets"
  - mpn: TLA2528IRTER
    manufacturer: Texas Instruments
    role: 8-channel 12-bit I2C ADC / GPIO, WQFN-16
    why: "Firmware driver already exists; GPIO levels follow AVDD; accuracy typical only (ADS7128 drop-in for guaranteed limits)"
    status: preferred
    projects: [FRONT_BOARD]
    notes: "LCSC C2866175"
  - mpn: PCA9617ADPJ
    manufacturer: NXP Semiconductors
    role: level translating Fm+ I2C repeater, TSSOP8
    why: "In stock replacement for the discontinued PCA9615DPJ on short board-to-board cables; port A faces port A across a cable"
    status: ok
    projects: [FRONT_BOARD]
    notes: "LCSC C128388"
  - mpn: BSC011N03LS
    manufacturer: Infineon
    role: N-MOSFET 30 V, 1.4 mOhm at 4.5 V, PG-TDSON-8, low-side motor switch
    why: "Proven by the user on a motor driver; prefer LS over LSI (much lower off-state leakage, more JLCPCB stock)"
    status: preferred
    projects: [FRONT_BOARD]
    notes: "JLCPCB C129786"
  - mpn: INA180A3IDBVR
    manufacturer: Texas Instruments
