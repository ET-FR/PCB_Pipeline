    status: preferred
    projects: [FRONT_BOARD]
    notes: ""
  - mpn: AO3400A
    manufacturer: Alpha & Omega Semiconductor
    role: N-MOSFET 30 V SOT-23 for small loads (valves, solenoids < 1 A)
    why: "JLCPCB basic part (C20917), logic level"
    status: preferred
    projects: [FRONT_BOARD]
    notes: ""
  - mpn: SS54
    manufacturer: MDD (Microdiode Semiconductor)
    role: Schottky 40 V 5 A SMA, freewheel diode
    why: "JLCPCB basic part (C22452)"
    status: preferred
    projects: [FRONT_BOARD]
    notes: ""
  - mpn: ESD5Z5.0T1G
